name: ContractGuard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --- Backend ---
  backend:
    name: Rust Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit and integration tests
        run: cargo test
        env:
          DATABASE_URL: sqlite::memory:

  # --- Frontend ---
  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

  # --- Sample project baseline verification ---
  # Tests that the broken fixture FAILS as expected
  sample-project-baseline:
    name: UploadLab Baseline (Expected Failures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_project/broken/backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sample_project/broken/backend/target
          key: ${{ runner.os }}-sample-cargo-${{ hashFiles('sample_project/broken/backend/Cargo.lock') }}

      - name: Run broken sample tests (expected failures)
        # Run tests and capture results without failing the CI pipeline
        # The broken tests are EXPECTED to fail — we verify they fail for the right reason
        run: |
          cargo test 2>&1 | tee test_output.txt || true
          echo "--- Checking expected test failures ---"
          if grep -q "test_upload_two_valid_files_bug002 ... FAILED" test_output.txt; then
            echo "PASS: BUG-002 reproduced (test_upload_two_valid_files_bug002 fails as expected)"
          else
            echo "WARNING: BUG-002 reproduction test not found"
          fi
          if grep -q "test_no_silent_omission_bug002 ... FAILED" test_output.txt; then
            echo "PASS: BUG-002 reproduced (test_no_silent_omission_bug002 fails as expected)"
          else
            echo "WARNING: BUG-002 silent omission test not found"
          fi

  # --- Sample frontend tests ---
  sample-frontend-baseline:
    name: UploadLab Frontend Baseline (Expected Failures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sample_project/broken/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sample_project/broken/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run broken sample tests (expected failures)
        run: |
          npm test 2>&1 | tee test_output.txt || true
          echo "--- Checking expected test failures ---"
          if grep -q "should use field name" test_output.txt; then
            echo "BUG-001 test output found"
          fi
