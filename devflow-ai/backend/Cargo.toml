[package]
name = "contractguard-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "contractguard"
path = "src/main.rs"

[lib]
name = "contractguard_lib"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "limit", "trace"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
once_cell = "1"
regex = "1"
walkdir = "2"
diff = "0.1"

[dev-dependencies]
axum-test = "14"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
